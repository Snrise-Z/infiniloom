# Secret scanning configuration
# Exclude test files from secret scanning - they contain fake secrets for testing the security scanner

paths-ignore:
  - '**/tests/**'
  - '**/test/**'
  - 'tests/**'
  - 'engine/tests/**'
  - 'cli/tests/**'
  - '**/fixtures/**'
  - '**/*_test.rs'
  - '**/*_tests.rs'
  - '**/security_comprehensive.rs'
  - '**/security_tests.rs'
