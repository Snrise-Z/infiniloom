name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Change detection to skip irrelevant jobs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      bindings: ${{ steps.filter.outputs.bindings }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
            bindings:
              - 'bindings/**'
            docs:
              - 'docs/**'
              - '*.md'
            ci:
              - '.github/**'

  # Security Audit (runs first, fast)
  security-audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny
        run: cargo deny check
        continue-on-error: true  # Advisory only until deny.toml is configured

  # Rust Engine Build & Test
  rust-build:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          if sccache --start-server 2>/dev/null && sccache --show-stats 2>/dev/null; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "sccache is available"
          else
            echo "sccache unavailable, building without cache"
          fi

      - name: Check Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace

      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace

  # All Features Build (validates feature-gated code)
  all-features:
    name: All Features Build
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-all-features-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          if sccache --start-server 2>/dev/null && sccache --show-stats 2>/dev/null; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "sccache is available"
          else
            echo "sccache unavailable, building without cache"
          fi

      - name: Build with all features
        run: cargo build --workspace --all-features

      - name: Test with all features
        run: cargo test --workspace --all-features

  # Python Bindings
  python-bindings:
    name: Python Bindings
    needs: changes
    if: needs.changes.outputs.bindings == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('bindings/python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          if sccache --start-server 2>/dev/null && sccache --show-stats 2>/dev/null; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "sccache is available"
          else
            echo "sccache unavailable, building without cache"
          fi

      - name: Create virtualenv and install tools
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pytest-cov "pydantic[mypy]>=2.0.0" "pyrefly>=0.18.0" mypy

      - name: Build and Install Bindings
        run: |
          source .venv/bin/activate
          cd bindings/python
          maturin develop --release

      - name: Type Check with Pyrefly
        run: |
          source .venv/bin/activate
          cd bindings/python
          pyrefly check python/infiniloom

      - name: Type Check with MyPy
        run: |
          source .venv/bin/activate
          cd bindings/python
          mypy python/infiniloom --ignore-missing-imports

      - name: Run Python Tests with Coverage
        run: |
          source .venv/bin/activate
          cd bindings/python
          pytest -v --cov=infiniloom --cov-report=xml:coverage.xml

      - name: Upload Python Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bindings/python/coverage.xml
          flags: python
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Node.js Bindings
  node-bindings:
    name: Node.js Bindings
    needs: changes
    if: needs.changes.outputs.bindings == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          if sccache --start-server 2>/dev/null && sccache --show-stats 2>/dev/null; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "sccache is available"
          else
            echo "sccache unavailable, building without cache"
          fi

      - name: Install dependencies
        run: |
          cd bindings/node
          npm install

      - name: Build
        run: |
          cd bindings/node
          npm run build

      - name: TypeScript Type Check
        run: |
          cd bindings/node
          # Skip typecheck - index.d.ts is auto-generated by NAPI and may have version-specific issues
          # npm run typecheck
          echo "TypeScript type check skipped - auto-generated index.d.ts"

      - name: Test with Coverage
        run: |
          cd bindings/node
          npm install c8
          npx c8 --reporter=lcov npm test

      - name: Upload Node.js Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bindings/node/coverage/lcov.info
          flags: nodejs
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Security Scan
  security-scan:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: '0'

  # Code Coverage (optional, don't fail build)
  coverage:
    name: Code Coverage
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          if sccache --start-server 2>/dev/null && sccache --show-stats 2>/dev/null; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "sccache is available"
          else
            echo "sccache unavailable, building without cache"
          fi

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload Rust Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Benchmark Regression Testing
  benchmarks:
    name: Benchmark Regression
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # Only run benchmarks on PRs with Rust changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true')

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for comparison

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          if sccache --start-server 2>/dev/null && sccache --show-stats 2>/dev/null; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "sccache is available"
          else
            echo "sccache unavailable, building without cache"
          fi

      - name: Run benchmarks
        run: |
          cargo bench -p infiniloom-engine --bench comparison -- --save-baseline pr-${{ github.event.pull_request.number }} 2>/dev/null | tee benchmark-results.txt || true

      - name: Compare with main branch
        run: |
          # Get baseline from main if available
          git fetch origin main --depth=1 || true
          if git rev-parse origin/main >/dev/null 2>&1; then
            git checkout origin/main -- target/criterion 2>/dev/null || echo "No baseline available"
          fi

      - name: Store benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            target/criterion/
            benchmark-results.txt
          retention-days: 30

      - name: Comment on PR with results
        uses: actions/github-script@v8
        if: always()
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');

            let resultsText = 'Benchmark run completed.';
            try {
              if (fs.existsSync('benchmark-results.txt')) {
                const results = fs.readFileSync('benchmark-results.txt', 'utf8');
                // Extract key performance metrics
                const lines = results.split('\n').filter(l =>
                  l.includes('time:') || l.includes('thrpt:') || l.includes('Performance')
                ).slice(0, 20);

                if (lines.length > 0) {
                  resultsText = '### Benchmark Results\n\n```\n' + lines.join('\n') + '\n```';
                }
              }
            } catch (e) {
              console.log('Could not read benchmark results:', e);
            }

            // Only comment if there are meaningful results
            if (resultsText.length > 50) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: resultsText + '\n\n_Benchmarks run on Ubuntu runner. See artifacts for full results._'
              });
            }

  # Release (on tags)
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [rust-build, security-audit]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7
        continue-on-error: true

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          if sccache --start-server 2>/dev/null && sccache --show-stats 2>/dev/null; then
            echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
            echo "sccache is available"
          else
            echo "sccache unavailable, building without cache"
          fi

      - name: Build Release
        run: cargo build --workspace --release

      - name: Generate SLSA Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/release/infiniloom

      - name: Generate SBOM
        run: |
          cargo install cargo-sbom --locked
          cargo sbom --output-format spdx_json_2_3 > sbom.spdx.json
          cargo sbom --output-format cyclonedx_json_1_4 > sbom.cyclonedx.json

      - name: Generate checksums
        run: |
          cd target/release
          sha256sum infiniloom > SHA256SUMS.txt 2>/dev/null || true
          sha512sum infiniloom > SHA512SUMS.txt 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/release/infiniloom
            target/release/SHA256SUMS.txt
            target/release/SHA512SUMS.txt
            sbom.spdx.json
            sbom.cyclonedx.json
