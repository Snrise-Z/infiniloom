name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (build but do not publish)'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Build CLI binaries for all platforms
  # ============================================================================
  build-binaries:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: infiniloom-linux-x64
            ext: ''
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: infiniloom-linux-arm64
            ext: ''
            cross: true
          # macOS x64 (Intel)
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: infiniloom-darwin-x64
            ext: ''
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: infiniloom-darwin-arm64
            ext: ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p infiniloom

      - name: Build (cross)
        if: matrix.cross
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} -p infiniloom

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/infiniloom${{ matrix.ext }} dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../${{ matrix.artifact }}.zip infiniloom${{ matrix.ext }}
          else
            tar czvf ../${{ matrix.artifact }}.tar.gz infiniloom${{ matrix.ext }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  # ============================================================================
  # Build Python wheels for all platforms
  # ============================================================================
  build-python:
    name: Python (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-15
            target: x86_64
          - os: macos-latest
            target: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU (Linux aarch64)
        if: matrix.target == 'aarch64' && runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheels (Linux)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
          manylinux: auto
          working-directory: bindings/python
          # Use manylinux_2_28 for better C99 support on aarch64
          container: ${{ matrix.target == 'aarch64' && 'ghcr.io/rust-cross/manylinux_2_28-cross:aarch64' || '' }}

      - name: Build wheels (macOS)
        if: runner.os == 'macOS'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
          working-directory: bindings/python

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  # Build source distribution
  build-python-sdist:
    name: Python sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: bindings/python/dist/*.tar.gz

  # ============================================================================
  # Build Node.js native modules for all platforms
  # ============================================================================
  build-node:
    name: Node.js (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node_arch: linux-x64-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            node_arch: linux-arm64-gnu
            cross: true
          - os: macos-15
            target: x86_64-apple-darwin
            node_arch: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            node_arch: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install dependencies
        working-directory: bindings/node
        run: npm install

      - name: Build (native)
        if: ${{ !matrix.cross }}
        working-directory: bindings/node
        run: npm run build -- --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        working-directory: bindings/node
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: npm run build -- --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.node_arch }}
          path: bindings/node/*.node

  # ============================================================================
  # Publish to crates.io
  # ============================================================================
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [build-binaries]
    if: ${{ !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish infiniloom-engine
        run: cargo publish -p infiniloom-engine --token ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true  # May already be published

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish infiniloom
        run: cargo publish -p infiniloom --token ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true  # May already be published

  # ============================================================================
  # Publish to PyPI
  # ============================================================================
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-python, build-python-sdist]
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v7
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ============================================================================
  # Publish to npm
  # ============================================================================
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-node]
    if: ${{ !inputs.dry_run }}
    permissions:
      id-token: write  # Required for npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all node artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: node-*
          path: bindings/node
          merge-multiple: true

      - name: List artifacts
        run: ls -la bindings/node/

      - name: Install dependencies
        working-directory: bindings/node
        run: npm install

      - name: Publish to npm with provenance
        working-directory: bindings/node
        run: npm publish --provenance --access public --ignore-scripts
        continue-on-error: true  # May already be published from a previous run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ============================================================================
  # Publish npm CLI package (for npm install -g infiniloom)
  # ============================================================================
  publish-npm-cli:
    name: Publish npm CLI
    runs-on: ubuntu-latest
    needs: [github-release]  # Needs release to exist for binary downloads
    if: ${{ !inputs.dry_run }}
    permissions:
      id-token: write  # Required for npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish CLI package to npm with provenance
        working-directory: packages/infiniloom
        run: npm publish --provenance --access public
        continue-on-error: true  # May already be published from a previous run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ============================================================================
  # Update Homebrew tap (Formula and Cask)
  # ============================================================================
  update-homebrew:
    name: Update Homebrew
    runs-on: ubuntu-latest
    needs: [build-binaries]
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Get release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download macOS binaries
        uses: actions/download-artifact@v7
        with:
          pattern: infiniloom-darwin-*
          path: binaries
          merge-multiple: true

      - name: Calculate SHA256 hashes
        id: sha
        run: |
          # Formula SHA (source tarball)
          curl -sL "https://github.com/Topos-Labs/infiniloom/archive/refs/tags/${{ steps.tag.outputs.tag }}.tar.gz" -o release.tar.gz
          FORMULA_SHA=$(shasum -a 256 release.tar.gz | cut -d ' ' -f 1)
          echo "formula=$FORMULA_SHA" >> $GITHUB_OUTPUT

          # Cask SHAs (pre-built binaries)
          INTEL_SHA=$(shasum -a 256 binaries/infiniloom-darwin-x64.tar.gz | cut -d ' ' -f 1)
          ARM_SHA=$(shasum -a 256 binaries/infiniloom-darwin-arm64.tar.gz | cut -d ' ' -f 1)
          echo "intel=$INTEL_SHA" >> $GITHUB_OUTPUT
          echo "arm=$ARM_SHA" >> $GITHUB_OUTPUT

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: Topos-Labs/homebrew-infiniloom
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula (build from source)
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix

          cat > homebrew-tap/Formula/infiniloom.rb << EOF
          class Infiniloom < Formula
            desc "High-performance repository context generator for LLMs"
            homepage "https://github.com/Topos-Labs/infiniloom"
            url "https://github.com/Topos-Labs/infiniloom/archive/refs/tags/${{ steps.tag.outputs.tag }}.tar.gz"
            sha256 "${{ steps.sha.outputs.formula }}"
            license "MIT"
            head "https://github.com/Topos-Labs/infiniloom.git", branch: "main"

            depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args(path: "cli")
            end

            test do
              system bin/"infiniloom", "--version"
            end
          end
          EOF

      - name: Update Cask (pre-built binary)
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix

          mkdir -p homebrew-tap/Casks
          cat > homebrew-tap/Casks/infiniloom.rb << EOF
          cask "infiniloom" do
            version "$VERSION"

            on_intel do
              url "https://github.com/Topos-Labs/infiniloom/releases/download/v#{version}/infiniloom-darwin-x64.tar.gz"
              sha256 "${{ steps.sha.outputs.intel }}"
            end

            on_arm do
              url "https://github.com/Topos-Labs/infiniloom/releases/download/v#{version}/infiniloom-darwin-arm64.tar.gz"
              sha256 "${{ steps.sha.outputs.arm }}"
            end

            name "Infiniloom"
            desc "High-performance repository context generator for LLMs"
            homepage "https://github.com/Topos-Labs/infiniloom"

            binary "infiniloom"

            zap trash: [
              "~/.infiniloom",
              "~/.config/infiniloom",
            ]
          end
          EOF

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/infiniloom.rb Casks/infiniloom.rb
          git commit -m "Update infiniloom to ${{ steps.tag.outputs.tag }}"
          git push

  # ============================================================================
  # Create GitHub Release
  # ============================================================================
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-python, build-python-sdist, build-node]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # CLI binaries
          find artifacts -name '*.tar.gz' -exec cp {} release-assets/ \;
          find artifacts -name '*.zip' -exec cp {} release-assets/ \;
          # Python wheels
          find artifacts -name '*.whl' -exec cp {} release-assets/ \;
          # List all assets
          ls -la release-assets/

      - name: Get release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Infiniloom ${{ steps.tag.outputs.tag }}
          draft: ${{ inputs.dry_run || false }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## Installation

            ### CLI (Recommended)

            **npm (easiest):**
            ```bash
            npm install -g infiniloom
            ```

            **Cargo:**
            ```bash
            cargo install infiniloom
            ```

            **Homebrew (macOS/Linux):**
            ```bash
            brew tap Topos-Labs/infiniloom
            brew install infiniloom
            ```

            **Direct download:** See attached binaries below.

            ### Python Library

            ```bash
            pip install infiniloom
            ```

            ### Node.js Library

            ```bash
            npm install infiniloom-node
            ```

            ## Verify Installation

            ```bash
            infiniloom --version
            infiniloom info
            ```
