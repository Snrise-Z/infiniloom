[package]
name = "infiniloom"
version = "0.7.0"
edition = "2021"
rust-version = "1.91"
description = "High-performance repository context generator for LLMs - Claude, GPT-4, Gemini optimized"
license = "MIT"
repository = "https://github.com/Topos-Labs/infiniloom"
keywords = ["llm", "ai", "code", "context", "repository"]
categories = ["command-line-utilities", "development-tools"]
readme = "../README.md"

[[bin]]
name = "infiniloom"
path = "src/main.rs"

[dependencies]
# Core engine
infiniloom-engine = { path = "../engine", version = "0.7.0" }

# CLI framework
clap = { version = "4.4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.4"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.0"

# File operations
walkdir = "2.4"
ignore = "0.4"

# Parallel processing
rayon = "1.8"
crossbeam-channel = "0.5"

# Logging
env_logger = "0.11"
log = "0.4"

# Progress indicators
indicatif = "0.18"

# Colored output
colored = "2.1"

# Human-readable output
humansize = "2.1"

# Regex for content processing
regex = "1.10"

# Lazy static initialization
once_cell = "1.19"

# Glob pattern matching
glob = "0.3"

# File watching
notify = "8.2"

# Random sampling
rand = "0.8"

# Temp directory (for remote clone cleanup)
tempfile = "3.10"

# Clipboard support (optional)
arboard = { version = "3.4", optional = true }

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.0"
filetime = "0.2"

[features]
default = ["document"]
# Document ingestion support (forwards to engine)
document = ["infiniloom-engine/document"]
# Enable clipboard support
clipboard = ["dep:arboard"]
# SQLite-backed manifest storage for embed command
sqlite-manifest = ["infiniloom-engine/sqlite-manifest"]

[lints]
workspace = true
